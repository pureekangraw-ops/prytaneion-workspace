name: PRYTANEION Read-only Recovery Tests
on:
  pull_request:
    paths:
      - "recovery/prytaneion-explorer/**"
      - "go-hub-route-contract.js"
      - "go-hub-authority-map.js"
      - ".github/workflows/prytaneion-recovery-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax of legacy modules and recovery entrance
        run: |
          node --check recovery/prytaneion-explorer/worker.mjs
          node --check go-hub-route-contract.js
          node --check go-hub-authority-map.js
      - name: Read-only entrypoint and bounded RPC tests
        run: node --test recovery/prytaneion-explorer/worker.test.mjs
