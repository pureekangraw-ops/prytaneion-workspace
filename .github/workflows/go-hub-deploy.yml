name: GO Hub Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_RUNTIME_API_TOKEN: ${{ secrets.CLOUDFLARE_RUNTIME_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOHUB_GITHUB_TOKEN: ${{ secrets.GOHUB_GITHUB_TOKEN }}
      GOHUB_MASTER_KEY: ${{ secrets.GOHUB_MASTER_KEY }}
      GOHUB_OWNER_PASSCODE: ${{ secrets.GOHUB_OWNER_PASSCODE }}
      GOHUB_NOTION_CLIENT_SECRET: ${{ secrets.GOHUB_NOTION_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight Cloudflare Google Drive bindings
        shell: bash
        run: |
          settings_file="${RUNNER_TEMP}/go-hub-drive-settings.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/go-hub/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > "${settings_file}"
          node - "${settings_file}" <<'NODE'
          const fs = require("node:fs");

          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const bindings = payload?.result?.bindings || [];
          const byName = new Map(bindings.map(binding => [binding.name, binding.type]));
          const aliases = {
            access: ["GOOGLE_DRIVE_ACCESS_TOKEN", "DRIVE_ACCESS_TOKEN", "GDRIVE_ACCESS_TOKEN", "GOOGLE_ACCESS_TOKEN", "GOOGLE_OAUTH_ACCESS_TOKEN", "GDRIVE_OAUTH_ACCESS_TOKEN"],
            refresh: ["GOOGLE_DRIVE_REFRESH_TOKEN", "DRIVE_REFRESH_TOKEN", "GDRIVE_REFRESH_TOKEN", "GOOGLE_REFRESH_TOKEN", "GOOGLE_OAUTH_REFRESH_TOKEN", "GDRIVE_OAUTH_REFRESH_TOKEN"],
            clientId: ["GOOGLE_DRIVE_CLIENT_ID", "DRIVE_CLIENT_ID", "GDRIVE_CLIENT_ID", "GOOGLE_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_ID", "GDRIVE_OAUTH_CLIENT_ID"],
            clientSecret: ["GOOGLE_DRIVE_CLIENT_SECRET", "DRIVE_CLIENT_SECRET", "GDRIVE_CLIENT_SECRET", "GOOGLE_CLIENT_SECRET", "GOOGLE_OAUTH_CLIENT_SECRET", "GDRIVE_OAUTH_CLIENT_SECRET"],
            root: ["GOOGLE_DRIVE_ROOT_FOLDER_ID", "DRIVE_ROOT_FOLDER_ID", "GDRIVE_ROOT_FOLDER_ID", "GOOGLE_DRIVE_FOLDER_ID", "DRIVE_FOLDER_ID", "GDRIVE_FOLDER_ID", "GOOGLE_ROOT_FOLDER_ID"],
          };
          const first = (names, types) => names.find(name => types.includes(byName.get(name)));
          const access = first(aliases.access, ["secret_text"]);
          const refresh = first(aliases.refresh, ["secret_text"]);
          const clientId = first(aliases.clientId, ["plain_text", "secret_text"]);
          const clientSecret = first(aliases.clientSecret, ["secret_text"]);
          const root = first(aliases.root, ["plain_text", "secret_text"]);
          const authReady = Boolean(access || (refresh && clientId && clientSecret));

          if (!authReady) {
            const candidates = bindings
              .filter(binding => /drive|google/i.test(String(binding.name || "")))
              .map(binding => `${binding.name}(${binding.type})`);
            console.error("::error::GO Hub Google Drive auth bindings are missing or use unsupported names/types.");
            console.error("::error::Expected either ACCESS_TOKEN secret or REFRESH_TOKEN + CLIENT_ID + CLIENT_SECRET.");
            console.error(`::error::Drive/Google-like bindings currently visible: ${candidates.join(", ") || "none"}`);
            process.exit(1);
          }

          console.log(`Cloudflare Google Drive preflight passed using ${access ? "access-token" : "refresh-token"} auth.`);
          console.log(`Root-folder scope binding: ${root ? root + "(" + byName.get(root) + ")" : "not configured (optional)"}.`);
          NODE

      - name: Verify GO Hub safety gate
        run: npm run deploy:gate

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight Cloudflare Linear bindings
        shell: bash
        run: |
          settings_file="${RUNNER_TEMP}/go-hub-settings.json"
          scripts_file="${RUNNER_TEMP}/workers-scripts.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/go-hub/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > "${settings_file}"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > "${scripts_file}"
          node - "${settings_file}" "${scripts_file}" <<'NODE'
          const fs = require("node:fs");

          (async () => {
            const settings = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const scripts = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
            const bindings = settings?.result?.bindings || [];
            const byName = new Map(bindings.map(binding => [binding.name, binding.type]));
            const apiSecretNames = ["LINEAR_API_KEY", "linear-API"];
            const apiSecretName = apiSecretNames.find(name => byName.get(name) === "secret_text");
            const teamKeyType = byName.get("LINEAR_TEAM_KEY");
            const missing = [];
            if (!apiSecretName) {
              console.error("::error::Cloudflare binding missing or wrong type: LINEAR_API_KEY or linear-API expected secret_text, got MISSING");
              missing.push("LINEAR_API_KEY or linear-API");
            }
            if (teamKeyType !== "plain_text") {
              console.error(`::error::Cloudflare binding missing or wrong type: LINEAR_TEAM_KEY expected plain_text, got ${teamKeyType || "MISSING"}`);
              missing.push("LINEAR_TEAM_KEY");
            }
            if (!missing.length) {
              console.log(`Cloudflare Linear binding preflight passed using API secret binding ${apiSecretName}.`);
              return;
            }

            console.error("::error::Locate misplaced Linear bindings across Cloudflare Workers.");
            let candidates = 0;
            const trackedNames = new Set([...apiSecretNames, "LINEAR_TEAM_KEY"]);
            const workerNames = (scripts?.result || []).map(worker => worker.id).filter(Boolean);
            for (const workerName of workerNames) {
              if (workerName === "go-hub") continue;
              const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${encodeURIComponent(workerName)}/settings`;
              const response = await fetch(url, {
                headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              });
              if (!response.ok) continue;
              const payload = await response.json();
              const matches = (payload?.result?.bindings || []).filter(binding => trackedNames.has(binding.name));
              if (!matches.length) continue;
              candidates += 1;
              console.error(`::error::candidate Worker ${workerName}: ${matches.map(binding => `${binding.name}(${binding.type})`).join(", ")}`);
            }
            if (!candidates) console.error("::error::No candidate Worker contains LINEAR_API_KEY, linear-API, or LINEAR_TEAM_KEY bindings.");
            process.exit(1);
          })().catch(error => {
            console.error(`::error::Cloudflare binding locator failed: ${error?.message || "unknown error"}`);
            process.exit(1);
          });
          NODE

      - name: Snapshot Cloudflare deployments
        run: node scripts/record-cloudflare-deployment.mjs snapshot "${RUNNER_TEMP}/go-hub-deployments-before.json"

      - name: Deploy GO Hub Worker
        shell: bash
        run: |
          secrets_file="${RUNNER_TEMP}/go-hub.secrets"
          : > "${secrets_file}"
          chmod 600 "${secrets_file}"
          if [ -n "${GOHUB_GITHUB_TOKEN}" ]; then
            printf 'GITHUB_TOKEN=%s\n' "${GOHUB_GITHUB_TOKEN}" >> "${secrets_file}"
          fi
          if [ -n "${CLOUDFLARE_RUNTIME_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            printf 'CLOUDFLARE_RUNTIME_API_TOKEN=%s\n' "${CLOUDFLARE_RUNTIME_API_TOKEN}" >> "${secrets_file}"
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "${CLOUDFLARE_ACCOUNT_ID}" >> "${secrets_file}"
          else
            echo "Cloudflare runtime bridge credentials are absent; Cloudflare MCP reads will remain fail-closed."
          fi
          if [ -n "${GOHUB_MASTER_KEY}" ] && [ -n "${GOHUB_OWNER_PASSCODE}" ]; then
            printf 'GOHUB_MASTER_KEY=%s\n' "${GOHUB_MASTER_KEY}" >> "${secrets_file}"
            printf 'GOHUB_OWNER_PASSCODE=%s\n' "${GOHUB_OWNER_PASSCODE}" >> "${secrets_file}"
          else
            echo "GO Hub OAuth secrets are incomplete; MCP will remain fail-closed."
          fi
          if [ -n "${GOHUB_NOTION_CLIENT_SECRET}" ]; then
            printf 'GOHUB_NOTION_CLIENT_SECRET=%s\n' "${GOHUB_NOTION_CLIENT_SECRET}" >> "${secrets_file}"
          else
            echo "Notion OAuth client secret is absent; the Notion MCP client will remain disabled."
          fi
          if [ -s "${secrets_file}" ]; then
            npx wrangler deploy --config wrangler.go-hub.jsonc --secrets-file "${secrets_file}"
          else
            npx wrangler deploy --config wrangler.go-hub.jsonc
          fi

      - name: Record Cloudflare deployment identity
        run: node scripts/record-cloudflare-deployment.mjs record "${RUNNER_TEMP}/go-hub-deployments-before.json" "${RUNNER_TEMP}/go-hub-deployment-receipt.json"

      - name: Preserve deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: go-hub-deployment-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/go-hub-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify deployed Cloudflare runtime bridge through MCP
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createTestAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const deployToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          if (!accountId || !deployToken || !signingKey) {
            console.error("::error::Cloudflare runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers:{ authorization:"Bearer " + deployToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) {
            console.error("::error::Unable to resolve workers.dev subdomain for Cloudflare runtime smoke.");
            process.exit(1);
          }

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const accessToken = await createTestAccessToken({ issuer:origin, signingKey });
          const response = await fetch(origin + "/mcp", {
            method:"POST",
            headers:{
              authorization:"Bearer " + accessToken,
              "content-type":"application/json",
              accept:"application/json, text/event-stream",
            },
            body:JSON.stringify({
              jsonrpc:"2.0",
              id:1,
              method:"tools/call",
              params:{ name:"go_hub_cloudflare_health", arguments:{} },
            }),
          });
          const payload = await response.json().catch(() => null);
          const proof = payload?.result?.structuredContent;
          if (!response.ok || payload?.error || payload?.result?.isError || proof?.ok !== true || proof?.upstream !== "PASS") {
            console.error("::error::GO Hub Cloudflare runtime MCP health failed: " + String(proof?.code || payload?.error?.message || response.status));
            process.exit(1);
          }
          console.log("GO Hub Cloudflare runtime MCP health passed; workers=" + String(proof.workerCount));
          NODE

      - name: Verify deployed LIGHTHOUSE Control Room runtime
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const ownerPasscode = process.env.GOHUB_OWNER_PASSCODE;
          if (!accountId || !cloudflareToken || !ownerPasscode) {
            console.error("::error::LIGHTHOUSE runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers: { authorization: "Bearer " + cloudflareToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) {
            console.error("::error::Unable to resolve Cloudflare workers.dev subdomain for LIGHTHOUSE smoke.");
            process.exit(1);
          }

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const workId = "SMOKE-LIGHTHOUSE-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT;
          const actor = "GO";
          const retryableStatus = status => status === 409 || status === 425 || status === 429 || status >= 500;
          const delay = attempt => new Promise(resolve => setTimeout(resolve, Math.min(500 * attempt, 2000)));
          const runtimeFetch = async (url, init = {}) => {
            let response = null;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              response = await fetch(url, init);
              if (!retryableStatus(response.status) || attempt === 8) return response;
              await delay(attempt);
            }
            return response;
          };
          const centre = async body => {
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              const response = await fetch(origin + "/hub/api/centre/action", {
                method:"POST",
                headers:{ "content-type":"application/json" },
                body:JSON.stringify(body),
              });
              const payload = await response.json().catch(() => null);
              if (response.ok && payload?.ok === true) return payload;
              const reason = String(payload?.code || payload?.message || response.status);
              const resetting = /Durable Object reset because its code was updated/i.test(reason);
              if (body?.action === "v4_create" && reason === "CENTRE_WORK_ALREADY_EXISTS") {
                const inspectResponse = await fetch(origin + "/hub/api/centre/action", {
                  method:"POST",
                  headers:{ "content-type":"application/json" },
                  body:JSON.stringify({ action:"v4_inspect", workId:body.workId }),
                });
                const existing = await inspectResponse.json().catch(() => null);
                if (inspectResponse.ok && existing?.ok === true &&
                    existing?.work?.workId === body.workId &&
                    existing?.work?.checkpointId === "CP-" + body.workId) {
                  return existing;
                }
              }
              if ((resetting || retryableStatus(response.status)) && attempt < 8) {
                await delay(attempt);
                continue;
              }
              throw new Error("CENTRE_SMOKE_FAILED:" + reason);
            }
            throw new Error("CENTRE_SMOKE_FAILED:retry-exhausted");
          };

          const created = await centre({
            action:"v4_create",
            workId,
            name:"LIGHTHOUSE runtime smoke",
            command:"Verify closed LIGHTHOUSE Control Room",
            expectedResult:"Work-bound room and owner-source readback verified",
            requestedDestinations:["lighthouse","factory","counter"],
            projectRefs:{
              WORK_CENTRE:{ ref:workId, status:"ACTIVE", workspace:"Centre", destination:"destination://centre" },
              FACTORY:{ ref:"FACTORY-" + workId, status:"ACTIVE", workspace:"Factory", destination:"destination://factory" },
              MAINTENANCE:{ ref:"MAINTENANCE-" + workId, status:"ACTIVE", workspace:"Maintenance", destination:"destination://maintenance" },
            },
          });
          if (created?.work?.checkpointId !== "CP-" + workId) {
            throw new Error("LIGHTHOUSE_CENTRE_CHECKPOINT_MISSING");
          }
          await centre({ action:"v4_claim", workId, actor });
          await centre({ action:"v4_open_pass", workId, actor, kind:"WORK", destinations:["lighthouse"] });

          const denied = await fetch(origin + "/hub/lighthouse", { redirect:"manual" });
          const deniedBody = await denied.json().catch(() => null);
          if (denied.status !== 403 || deniedBody?.code !== "LIGHTHOUSE_CENTRE_PASS_REQUIRED") {
            throw new Error("LIGHTHOUSE_BYPASS_GUARD_FAILED");
          }

          const roomUrl = origin + "/hub/lighthouse?work_id=" + encodeURIComponent(workId) + "&actor=" + encodeURIComponent(actor);
          const roomResponse = await runtimeFetch(roomUrl, { redirect:"manual" });
          const roomHtml = await roomResponse.text();
          const requiredText = [
            "LIGHTHOUSE Control Room",
            "Live Reality Board",
            "LIGHTHOUSE Transfer Form",
            "Report Inbox + LIGHTHOUSE Maintenance",
            "Run LIGHTHOUSE Check",
            "Returned Reports",
            "Latest App State",
            "Diagnostic Trace",
            "Return Centre",
            "No cross-room Service Path",
          ];
          if (!roomResponse.ok || requiredText.some(value => !roomHtml.includes(value))) {
            throw new Error("LIGHTHOUSE_ROOM_RENDER_FAILED");
          }

          const realityResponse = await runtimeFetch(
            origin + "/hub/api/lighthouse-control-port/owner-state?work_id=" + encodeURIComponent(workId) + "&actor=" + encodeURIComponent(actor),
            {
              method:"POST",
              headers:{ "content-type":"application/json", "x-go-owner-passcode":ownerPasscode },
              body:"{}",
            },
          );
          const reality = await realityResponse.json().catch(() => null);
          if (!realityResponse.ok || reality?.ok !== true ||
              !Array.isArray(reality?.commands) || !Array.isArray(reality?.receipts) ||
              !Object.prototype.hasOwnProperty.call(reality || {}, "appState")) {
            throw new Error("LIGHTHOUSE_OWNER_REALITY_FAILED:" + (reality?.code || realityResponse.status));
          }

          const returnedOpen = await centre({
            action:"v4_return",
            workId,
            actor,
            status:"OPEN",
            result:{ room:"LIGHTHOUSE_CONTROL_ROOM", outcome:"RETURNED_TO_CENTRE" },
            evidence:[{ kind:"RUNTIME_SMOKE", reference:"github-actions:" + process.env.GITHUB_RUN_ID + ":return-open" }],
          });
          if (returnedOpen?.work?.status !== "OPEN" || returnedOpen?.work?.holder !== null || returnedOpen?.work?.pass?.state !== "CLOSED") {
            throw new Error("LIGHTHOUSE_RETURN_CENTRE_OPEN_FAILED");
          }

          await centre({ action:"v4_claim", workId, actor });
          await centre({ action:"v4_open_pass", workId, actor, kind:"WORK", destinations:["lighthouse"] });
          const reentered = await runtimeFetch(roomUrl, { redirect:"manual" });
          if (!reentered.ok || !(await reentered.text()).includes("LIGHTHOUSE Control Room")) {
            throw new Error("LIGHTHOUSE_SAME_WORK_REENTRY_FAILED");
          }

          const phaseReturn = await centre({
            action:"v4_return",
            workId,
            actor,
            status:"OPEN",
            result:{ room:"LIGHTHOUSE_CONTROL_ROOM", outcome:"LIGHTHOUSE_PHASE_VERIFIED" },
          });
          if (phaseReturn?.work?.status !== "OPEN" || phaseReturn?.work?.holder !== null || phaseReturn?.work?.pass?.state !== "CLOSED") {
            throw new Error("LIGHTHOUSE_PHASE_RETURN_OPEN_FAILED");
          }

          console.log("LIGHTHOUSE Control Room runtime smoke passed: entry, reality, Return Centre OPEN and same-Work re-entry; same Work left OPEN for V4 close-loop smoke.");
          NODE

      - name: Verify deployed LIGHT MCP runtime
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          if (!accountId || !cloudflareToken || !signingKey) {
            console.error("::error::LIGHT MCP runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers: { authorization: "Bearer " + cloudflareToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) {
            console.error("::error::Unable to resolve Cloudflare workers.dev subdomain for LIGHT MCP smoke.");
            process.exit(1);
          }

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const token = await createAccessToken({
            issuer: origin,
            signingKey,
            resource: origin + "/mcp",
            subject: "light",
            scope: "go-hub-light",
            ttlSeconds: 600,
          });
          const toolsResponse = await fetch(origin + "/mcp", {
            method: "POST",
            headers: {
              authorization: "Bearer " + token,
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
              origin: "https://app.notion.com",
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "tools/list",
              params: {},
            }),
          });
          const toolsPayload = await toolsResponse.json().catch(() => null);
          const lightNames = (toolsPayload?.result?.tools || []).map(tool => tool?.name).filter(Boolean).sort();
          const goToken = await createAccessToken({
            issuer: origin,
            signingKey,
            resource: origin + "/mcp",
            subject: "GO",
            scope: "go-hub",
            ttlSeconds: 600,
          });
          const goToolsResponse = await fetch(origin + "/mcp", {
            method: "POST",
            headers: {
              authorization: "Bearer " + goToken,
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 2,
              method: "tools/list",
              params: {},
            }),
          });
          const goToolsPayload = await goToolsResponse.json().catch(() => null);
          const goNames = (goToolsPayload?.result?.tools || []).map(tool => tool?.name).filter(Boolean).sort();
          const required = [
            "go_hub_delete_file",
            "go_hub_merge_pull_request",
            "go_hub_centre_live_action",
            "go_hub_maintenance",
            "go_hub_factory_v4",
            "go_hub_aion_open",
            "go_hub_pixie_command",
          ];
          const missing = required.filter(name => !lightNames.includes(name));
          const sameSurface = JSON.stringify(lightNames) === JSON.stringify(goNames);
          if (!toolsResponse.ok || toolsPayload?.error || !goToolsResponse.ok || goToolsPayload?.error || missing.length || !sameSurface) {
            console.error("::error::GO/LIGHT unified MCP live tool surface mismatch.");
            if (missing.length) console.error("::error::LIGHT missing shared tools: " + missing.join(", "));
            if (!sameSurface) console.error("::error::GO and LIGHT tool lists differ.");
            process.exit(1);
          }

          const ownerPage = await fetch(origin + "/hub/light-mcp", { redirect:"manual" });
          const ownerHtml = await ownerPage.text();
          if (!ownerPage.ok || !/GO Hub × LIGHT/.test(ownerHtml) || !/Mint a scoped bearer token for LIGHT/.test(ownerHtml)) {
            console.error("::error::LIGHT MCP owner page live readback failed.");
            process.exit(1);
          }

          console.log("GO Hub LIGHT MCP runtime smoke passed.");
          NODE


      - name: Verify deployed GO Hub V4 close-loop runtime
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          if (!accountId || !cloudflareToken || !signingKey) {
            console.error("::error::V4 close-loop runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers:{ authorization:"Bearer " + cloudflareToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) throw new Error("V4_CLOSE_LOOP_SUBDOMAIN_UNAVAILABLE");

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const workId = "SMOKE-LIGHTHOUSE-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT;
          const checkpointId = "CP-" + workId;
          const actor = "GO";
          const counterId = "COUNTER-V4-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT;
          const ownerToken = await createAccessToken({
            issuer:origin, signingKey, resource:origin + "/mcp", subject:"big", scope:"go-hub", ttlSeconds:600,
          });
          const lightToken = await createAccessToken({
            issuer:origin, signingKey, resource:origin + "/mcp", subject:"light", scope:"go-hub-light", ttlSeconds:600,
          });
          const context = () => ({ workId, checkpointId });
          let rpcId = 10;
          const mcp = async (path, token, name, args, { allowToolError=false, notionOrigin=false } = {}) => {
            const headers = {
              authorization:"Bearer " + token,
              "content-type":"application/json",
              accept:"application/json, text/event-stream",
            };
            if (notionOrigin) headers.origin = "https://app.notion.com";
            const response = await fetch(origin + path, {
              method:"POST",
              headers,
              body:JSON.stringify({
                jsonrpc:"2.0",
                id:rpcId++,
                method:"tools/call",
                params:{ name, arguments:args },
              }),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.error) {
              throw new Error(name + "_RPC_FAILED:" + (payload?.error?.message || response.status));
            }
            const tool = payload?.result;
            const proof = tool?.structuredContent || {};
            if (tool?.isError && !allowToolError) {
              throw new Error(name + "_TOOL_FAILED:" + (proof?.code || JSON.stringify(proof)));
            }
            return { tool, proof };
          };
          const listTools = async () => {
            const response = await fetch(origin + "/mcp", {
              method:"POST",
              headers:{
                authorization:"Bearer " + ownerToken,
                "content-type":"application/json",
                accept:"application/json, text/event-stream",
              },
              body:JSON.stringify({ jsonrpc:"2.0", id:rpcId++, method:"tools/list", params:{} }),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.error) throw new Error("V4_TOOL_LIST_FAILED");
            return (payload?.result?.tools || []).map(tool => tool?.name).filter(Boolean);
          };
          const centre = async body => {
            const response = await fetch(origin + "/hub/api/centre/action", {
              method:"POST",
              headers:{ "content-type":"application/json" },
              body:JSON.stringify(body),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.ok !== true) {
              throw new Error("CENTRE_V4_CLOSE_LOOP_FAILED:" + (payload?.code || payload?.message || response.status));
            }
            return payload;
          };

          const names = await listTools();
          const requiredTools = [
            "go_hub_centre_live_action",
            "go_hub_heimdall_pass",
            "go_hub_v4_project_board",
            "go_hub_factory_v4",
            "go_hub_maintenance",
            "go_hub_counter_create",
            "go_hub_counter_pickup",
            "go_hub_counter_answer",
            "go_hub_counter_readback",
            "go_hub_board_read",
          ];
          const legacyFactoryTools = [
            "go_hub_factory_action",
            "go_hub_factory_auto",
            "go_hub_factory_ready_gate",
            "go_hub_factory_foreman",
          ];
          const missing = requiredTools.filter(name => !names.includes(name));
          const legacyExposed = legacyFactoryTools.filter(name => names.includes(name));
          if (missing.length || legacyExposed.length) {
            throw new Error("V4_MCP_SURFACE_MISMATCH missing=" + missing.join(",") + " legacy=" + legacyExposed.join(","));
          }

          let inspected = await mcp("/mcp", ownerToken, "go_hub_centre_live_action", {
            action:"v4_inspect", workId, checkpointId,
          });
          if (inspected.proof?.work?.status !== "OPEN" || inspected.proof?.work?.workId !== workId) {
            throw new Error("V4_INSPECT_LIVE_WORK_FAILED");
          }

          // WORK Pass + Factory V4.
          await centre({ action:"v4_claim", workId, actor });
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"open", kind:"WORK",
            destinations:["factory"], workContext:context(),
          });
          inspected = await mcp("/mcp", ownerToken, "go_hub_centre_live_action", {
            action:"v4_inspect", workId, checkpointId,
          });
          if (inspected.proof?.work?.pass?.kind !== "WORK" || inspected.proof?.work?.pass?.state !== "ACTIVE") {
            throw new Error("WORK_PASS_RUNTIME_FAILED");
          }
          const factoryForm = {
            projectId:"FACTORY-" + workId,
            repository:"pureekangraw-ops/standard-",
            branch:"main",
            plan:"Verify deployed V4 Factory lifecycle against production runtime",
            expectedOutput:"Production runtime Factory receipt",
            outputType:"REF",
            preProductionInspection:{
              inspectionStatus:"PASS",
              sanitizationStatus:"PASS",
              evidence:{ source:"GO_HUB_RUNTIME_SMOKE", workflowRunId:process.env.GITHUB_RUN_ID, headSha:process.env.GITHUB_SHA },
            },
            criticalChecklist:[{ id:"runtime", label:"Production runtime verified" }],
          };
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", {
            action:"start", form:factoryForm, workContext:context(),
          });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", {
            action:"record_reality",
            reality:{ repository:factoryForm.repository, branch:"main", headSha:process.env.GITHUB_SHA, lastUpdated:new Date().toISOString() },
            workContext:context(),
          });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", { action:"advance", workContext:context() });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", { action:"advance", result:{ built:true }, workContext:context() });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", { action:"advance", result:{ assembled:true }, workContext:context() });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", { action:"advance", result:{ deployment:"production" }, workContext:context() });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", {
            action:"update_check", checkId:"runtime", status:"PASS",
            evidence:"github-actions:" + process.env.GITHUB_RUN_ID, workContext:context(),
          });
          await mcp("/mcp", ownerToken, "go_hub_factory_v4", { action:"advance", workContext:context() });
          const factoryDone = await mcp("/mcp", ownerToken, "go_hub_factory_v4", {
            action:"finish", ref:"github-actions:" + process.env.GITHUB_RUN_ID + ":factory-v4",
            summary:"Factory V4 production lifecycle verified", workContext:context(),
          });
          if (factoryDone.proof?.task?.output?.type !== "REF" || factoryDone.proof?.task?.projectRef?.status !== "COMPLETE") {
            throw new Error("FACTORY_V4_PRODUCTION_OUTPUT_FAILED");
          }
          const projectBoard = await mcp("/mcp", ownerToken, "go_hub_v4_project_board", { workId, checkpointId });
          if (!Array.isArray(projectBoard.proof?.board) || !projectBoard.proof.board.some(item => item?.workId === workId)) {
            throw new Error("V4_PROJECT_BOARD_RUNTIME_FAILED");
          }
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"close", status:"OPEN",
            result:{ pass:"WORK", factory:"PASS" }, workContext:context(),
          });

          // READ Pass + GO -> LIGHT -> GO Counter close-loop.
          await centre({ action:"v4_claim", workId, actor });
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"open", kind:"READ",
            destinations:["counter"], workContext:context(),
          });
          await mcp("/mcp", ownerToken, "go_hub_counter_create", {
            counterId, mode:"HANDOFF",
            request:"Acknowledge the production Counter/LIGHT close-loop smoke for the same Work.",
            requestedResult:"LIGHT picks up, answers, and GO records readback on the same Counter ticket.",
            authority:"READ_ONLY_SMOKE", target:"LIGHT",
            context:{ source:"GO_HUB_V4_RUNTIME_SMOKE" },
            workContext:context(),
          });
          await mcp("/mcp", lightToken, "go_hub_counter_pickup", {
            counterId, workContext:context(),
          }, { notionOrigin:true });
          await mcp("/mcp", lightToken, "go_hub_counter_answer", {
            counterId, status:"ANSWERED", answer:"Counter/LIGHT production close-loop passed.",
            sources:["production://go-hub/counter"], evidence:[{ ref:"github-actions:" + process.env.GITHUB_RUN_ID + ":counter-light" }],
            confidence:"HIGH", nextRoute:"GO", workContext:context(),
          }, { notionOrigin:true });
          const readback = await mcp("/mcp", ownerToken, "go_hub_counter_readback", {
            counterId, evidence:{ ref:"github-actions:" + process.env.GITHUB_RUN_ID + ":counter-readback" },
            close:true, workContext:context(),
          });
          if (readback.proof?.counter?.currentState !== "CLOSED") throw new Error("COUNTER_LIGHT_READBACK_NOT_CLOSED");
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"close", status:"OPEN",
            result:{ pass:"READ", counterLight:"PASS" }, workContext:context(),
          });

          // READ Pass + safe production maintenance route probe.
          // Full-system verification requires live Control Room truth; a route-only smoke must not mint repair authority.
          await centre({ action:"v4_claim", workId, actor });
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"open", kind:"READ",
            destinations:["maintenance"], workContext:context(),
          });
          inspected = await mcp("/mcp", ownerToken, "go_hub_centre_live_action", {
            action:"v4_inspect", workId, checkpointId,
          });
          if (inspected.proof?.work?.pass?.kind !== "READ" || inspected.proof?.work?.pass?.state !== "ACTIVE") {
            throw new Error("MAINTENANCE_READ_PASS_RUNTIME_FAILED");
          }
          const maintenance = await mcp("/mcp", ownerToken, "go_hub_maintenance", {
            action:"probe_route",
            routeId:"runtime-owner-bindings",
            projectId:"MAINTENANCE-" + workId,
            map:{
              source:"GO_V4_RUNTIME_CLOSE_LOOP",
              routes:[{
                id:"runtime-owner-bindings",
                from:"go-hub",
                to:"owner-sources",
                checkpoints:[
                  { id:"centre-binding", importantValue:"Centre Durable Store binding present", expected:true, source:"binding:GO_HUB_CENTRE_STATE", probeAction:"read", mode:"READ", ownerSource:"Cloudflare Worker binding" },
                  { id:"factory-binding", importantValue:"Factory Durable Store binding present", expected:true, source:"binding:GO_HUB_FACTORY_STATE", probeAction:"read", mode:"READ", ownerSource:"Cloudflare Worker binding" },
                  { id:"counter-binding", importantValue:"Counter Durable Store binding present", expected:true, source:"binding:GO_HUB_COUNTER_STATE", probeAction:"read", mode:"READ", ownerSource:"Cloudflare Worker binding" },
                ],
              }],
            },
            workContext:context(),
          });
          if (maintenance.proof?.status !== "MAINTENANCE_CHECK_COMPLETE" ||
              maintenance.proof?.next !== "ROUTE_VERIFIED" ||
              maintenance.proof?.fullSystemVerified !== false ||
              maintenance.proof?.autoRepair !== false ||
              !Array.isArray(maintenance.proof?.routes) ||
              maintenance.proof.routes.some(route => route?.status !== "PASS")) {
            throw new Error("MAINTENANCE_V4_PRODUCTION_ROUTE_CHECK_FAILED:" + JSON.stringify(maintenance.proof));
          }
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"close", status:"OPEN",
            result:{ pass:"READ", maintenanceRoute:"PASS" }, workContext:context(),
          });

          // EMERGENCY Pass age: expired must fail, bounded future pass must work.
          await centre({ action:"v4_claim", workId, actor });
          const expired = await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"open", kind:"EMERGENCY", scope:["factory"],
            expiresAt:new Date(Date.now() - 60_000).toISOString(),
            reason:"Production expiry guard smoke", audit:{ source:"GO_V4_RUNTIME_SMOKE" },
            workContext:context(),
          }, { allowToolError:true });
          if (!expired.tool?.isError || !/expired/i.test(JSON.stringify(expired.proof))) {
            throw new Error("EMERGENCY_EXPIRED_PASS_WAS_NOT_REJECTED:" + JSON.stringify(expired.proof));
          }
          const validExpiry = new Date(Date.now() + 5 * 60_000).toISOString();
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"open", kind:"EMERGENCY", scope:["factory"],
            expiresAt:validExpiry, reason:"Bounded production recovery smoke", audit:{ source:"GO_V4_RUNTIME_SMOKE" },
            workContext:context(),
          });
          inspected = await mcp("/mcp", ownerToken, "go_hub_centre_live_action", {
            action:"v4_inspect", workId, checkpointId,
          });
          if (inspected.proof?.work?.pass?.kind !== "EMERGENCY" ||
              Date.parse(inspected.proof?.work?.pass?.expiresAt || "") <= Date.now()) {
            throw new Error("EMERGENCY_LIVE_AGE_PROOF_FAILED");
          }
          await mcp("/mcp", ownerToken, "go_hub_heimdall_pass", {
            action:"close", status:"OPEN",
            result:{ pass:"EMERGENCY", expiryGuard:"PASS" }, workContext:context(),
          });

          // Final Return on the same Work, then force Board read-model reconciliation.
          await centre({ action:"v4_claim", workId, actor });
          await centre({ action:"v4_open_pass", workId, actor, kind:"WORK", destinations:["lighthouse"] });
          const cleanup = await centre({
            action:"v4_return", workId, actor, status:"CANCEL",
            result:{ outcome:"V4_CLOSE_LOOP_RUNTIME_VERIFIED" },
            evidence:[{ ref:"github-actions:" + process.env.GITHUB_RUN_ID + ":v4-close-loop" }],
          });
          if (cleanup?.work?.status !== "CANCEL" || cleanup?.work?.pass?.state !== "CLOSED") {
            throw new Error("V4_FINAL_RETURN_CANCEL_FAILED");
          }

          const board = await mcp("/mcp", ownerToken, "go_hub_board_read", {});
          const pin = (board.proof?.pins || []).find(item => item?.workId === workId);
          if (!pin || pin.status !== "ARCHIVED") {
            throw new Error("V4_BOARD_CANCEL_PROJECTION_FAILED:" + JSON.stringify(pin || null));
          }
          for (const staleWorkId of ["SMOKE-LIGHTHOUSE-35946205465-1", "SMOKE-LIGHTHOUSE-35967381162-1"]) {
            const stale = (board.proof?.pins || []).find(item => item?.workId === staleWorkId);
            if (stale?.status === "OPEN") throw new Error("STALE_BOARD_PIN_STILL_OPEN:" + staleWorkId);
          }

          console.log("GO Hub V4 production close-loop passed: v4_inspect, WORK/READ/MAINTENANCE/EMERGENCY Passes, Factory V4, Maintenance, Counter/LIGHT, Project Board, final Return and Centre-backed Board.");
          NODE

      - name: Verify deployed Browser Observer Durable Object binding through MCP
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createTestAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          if (!accountId || !cloudflareToken || !signingKey) {
            console.error("::error::Observer runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers: { authorization: "Bearer " + cloudflareToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) {
            console.error("::error::Unable to resolve Cloudflare workers.dev subdomain for Observer smoke.");
            process.exit(1);
          }

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const accessToken = await createTestAccessToken({ issuer: origin, signingKey });
          const listResponse = await fetch(origin + "/mcp", {
            method:"POST",
            headers:{
              authorization:"Bearer " + accessToken,
              "content-type":"application/json",
              accept:"application/json, text/event-stream",
            },
            body:JSON.stringify({ jsonrpc:"2.0", id:0, method:"tools/list", params:{} }),
          });
          const listPayload = await listResponse.json().catch(() => null);
          const driveNames = (listPayload?.result?.tools || []).map(tool => tool?.name).filter(Boolean);
          if (!listResponse.ok || listPayload?.error || !driveNames.includes("go_hub_drive_download_file")) {
            console.error("::error::GO Hub Drive binary download tool is not published.");
            process.exit(1);
          }
          const response = await fetch(origin + "/mcp", {
            method: "POST",
            headers: {
              authorization: "Bearer " + accessToken,
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "tools/call",
              params: { name: "go_hub_observer_latest", arguments: {} },
            }),
          });
          const payload = await response.json().catch(() => null);
          const toolResult = payload?.result;
          const proof = toolResult?.structuredContent;
          const code = proof?.code || payload?.error?.message || null;
          const expectedIdle = code === "SESSION_INACTIVE" || code === "SESSION_EXPIRED";
          const reachable = response.ok && !payload?.error &&
            (proof?.ok === true || expectedIdle);
          if (!reachable) {
            console.error("::error::Browser Observer Durable Object runtime is unreachable: " + (code || "OBSERVER_RUNTIME_SMOKE_FAILED"));
            process.exit(1);
          }
          console.log("Browser Observer Durable Object runtime is reachable (" + (code || "ACTIVE_SESSION") + ").");
          NODE

